---
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

default_install_hook_types: [commit-msg, pre-commit]
default_stages: [pre-commit, manual, pre-push]

exclude: "(^.*tests/.*$)"

repos:
  # src: https://github.com/pre-commit/pre-commit-hooks
  - repo: local
    hooks:
      - id: check-merge-conflict
        name: "check-merge-conflict (files with merge markes)"
        entry: check-merge-conflict
        language: system

      - id: check-added-large-files
        name: check-added-large-files (files >4MB)
        entry: check-added-large-files
        language: system
        stages: [pre-commit, pre-push, manual]
        args: ["--maxkb=4096"]

      - id: check-case-conflict
        name: >-
          check-case-conflict (filenames conflicting on case insensitive
          filesystems)
        entry: check-case-conflict
        language: system

      - id: check-toml
        name: check-toml (toml syntax check)
        entry: check-toml
        language: system
        types: [toml]

      - id: end-of-file-fixer
        name: end-of-file-fixer (check and add a single newline at file end)
        entry: end-of-file-fixer
        language: system
        types: [text]
        stages: [pre-commit, pre-push, manual]

      - id: trailing-whitespace
        name: trailing.whitespace (check and fix trailing whitespaces)
        entry: trailing-whitespace-fixer
        language: system
        types: [text]
        stages: [pre-commit, pre-push, manual]

  # src: https://github.com/pre-commit/mirrors-mypy
  - repo: local
    hooks:
      - id: mypy
        name: mypy (python linter)
        entry: mypy --ignore-missing-imports
        language: system
        "types_or": [python, pyi]
        require_serial: true

  # src: srhttps://github.com/astral-sh/ruff-pre-commit
  - repo: local
    hooks:
      - id: ruff
        name: ruff check (python linter)
        entry: ruff check --force-exclude
        language: system
        "types_or": [python, pyi]
        require_serial: true

      - id: ruff
        name: ruff format (python formatter)
        entry: ruff format --force-exclude
        language: system
        "types_or": [python, pyi]
        pass_filenames: false  # apply formatting to the whole project
        require_serial: true

  - repo: local
    hooks:
      - id: yamllint
        name: yamllint (yaml linter)
        entry: yamllint
        language: system
        types: [file, yaml]

  # src: https://github.com/commitizen-tools/commitizen
  - repo: local
    hooks:
      - id: commitizen
        name: cz check (validate conventional commit messages)
        entry: cz check
        args: [--allow-abort, --commit-msg-file]
        stages: [commit-msg]
        language: system

  # src: https://github.com/gitleaks/gitleaks
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (Detect hardcoded secrets)
        description: Detect hardcoded secrets using Gitleaks
        entry: gitleaks git --pre-commit --redact --staged --verbose
        language: golang
        pass_filenames: false

  - repo: local
    hooks:
      - id: poetry-check
        name: poetry check (poetry configuration check)
        entry: poetry check
        language: system
        pass_filenames: false
        files: ^(.*/)?pyproject\.toml$

      - id: poetry-lock
        name: poetry lock (poetry lockfile generation - once a day)
        entry: |
          python -c '
          import pathlib
          import subprocess

          DAYS = 1
          file=pathlib.Path("test.txt")
          if (
              file.exists()
              and file.stat().st_mtime
              < (pathlib.Path(".").stat().st_mtime - DAYS * 24 * 60 * 60)
          ):
             subprocess.run(["poetry", "lock"])
          '
        language: system
        pass_filenames: false
        files: ^(.*/)?(poetry\.lock|pyproject\.toml)$
