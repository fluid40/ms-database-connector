services:
  influx_database_v1:
    image: influxdb:1.11.8
    container_name: ms-dbc-influx-v1
    volumes:
      - influxdb_v1_data:/var/lib/influxdb
    restart: always
    environment:
      INFLUXDB_DB: submodel-db
      INFLUXDB_ADMIN_USER: admin
      INFLUXDB_ADMIN_PASSWORD: fluid40secure!
      INFLUXDB_USER: fluid40
      INFLUXDB_USER_PASSWORD: wbEx!S!#4OHcN!5X
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  influx_database_v2:
    image: influxdb:2.7
    container_name: ms-dbc-influx-v2
    ports:
      - "8031:8086"
    volumes:
      - influxdb_v2_data:/var/lib/influxdb2
    restart: always
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: fluid40secure!
      DOCKER_INFLUXDB_INIT_ORG: fluid40-org
      DOCKER_INFLUXDB_INIT_BUCKET: fluid40-bucket
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: wbEx!S!#4OHcN!5X
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  dev_container:
    build: .
    container_name: ms-dbc-dev-container
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    depends_on:
        influx_database_v1:
          condition: service_healthy
        influx_database_v2:
          condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      INFLUX_DB_V1_SECRET: wbEx!S!#4OHcN!5X
      INFLUXDB_V2_TOKEN: KHp3QMb8S6G7XWkZRZQh5-4Ds_9DH1rj7Qxn2bmOA2gpDFKAx7A1w4XjCA6xN_GREDLwPWWhh5eRX39LqZ-g_A==

volumes:
  influxdb_v1_data:
  influxdb_v2_data:
